{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'expenses/app.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Logout | Expense Tracker</title>
    <style>
        :root {
            --indigo: #4f46e5;
            --indigo-dark: #312e81;
            --purple: #7c3aed;
            --ink: #172033;
            --muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            align-items: center;
            background: linear-gradient(135deg, var(--indigo-dark), var(--indigo) 52%, var(--purple));
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            animation: appear 0.4s ease-out;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(15, 23, 42, 0.35);
            max-width: 440px;
            padding: 42px 34px 34px;
            text-align: center;
            width: 100%;
        }

        .icon {
            align-items: center;
            background: #eef2ff;
            border-radius: 20px;
            color: var(--indigo);
            display: flex;
            height: 78px;
            justify-content: center;
            margin: 0 auto 22px;
            width: 78px;
        }

        .icon svg { height: 38px; width: 38px; }

        h1 {
            color: var(--ink);
            font-size: clamp(24px, 5vw, 30px);
            margin-bottom: 12px;
        }

        .message {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .user {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 26px;
            padding: 13px 16px;
        }

        .user strong { color: var(--indigo); overflow-wrap: anywhere; }

        .buttons { display: flex; gap: 12px; }

        .btn {
            align-items: center;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            flex: 1;
            font-size: 14px;
            font-weight: 700;
            justify-content: center;
            min-height: 48px;
            padding: 12px 16px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn:hover { transform: translateY(-2px); }
        .cancel { background: #eef2ff; color: var(--indigo); }
        .cancel:hover { background: #e0e7ff; }
        .logout { background: linear-gradient(90deg, #ef4444, #dc2626); color: #fff; }
        .logout:hover { box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25); }

        .security { color: #94a3b8; font-size: 11px; margin-top: 20px; }

        @keyframes appear {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 500px) {
            .card { padding: 34px 22px 26px; }
            .buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M21 19V5a2 2 0 0 0-2-2h-6"></path>
            </svg>
        </div>

        <h1>Are you sure you want to logout?</h1>
        <p class="message">Your current Expense Tracker session will be ended.</p>

        <div class="user">
            Logged in as <strong>{{ request.user.username }}</strong>
        </div>

        <div class="buttons">
            <a href="{% url 'dashboard' %}" class="btn cancel">Cancel</a>
            <form method="post" action="{% url 'logout_confirm' %}" style="display: contents;">
                {% csrf_token %}
                <button type="submit" class="btn logout">Yes, Logout</button>
            </form>
        </div>

        <p class="security">Your session is securely protected.</p>
    </main>
</body>
</html>
