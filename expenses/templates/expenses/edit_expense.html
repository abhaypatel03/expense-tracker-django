{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{% static 'expenses/app.css' %}">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Expense | Expense Tracker</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            color: #172033;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 74px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            color: white;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.18);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: white;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 13px;
            border-radius: 10px;
            transition: 0.25s ease;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .nav-links .active {
            background: rgba(255, 255, 255, 0.18);
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white !important;
            padding: 10px 16px;
            border-radius: 10px;
            box-shadow: 0 8px 18px rgba(239, 68, 68, 0.25);
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 90%;

            max-width: 650px;

            margin: 45px auto;
        }


        /* =========================
           CARD
        ========================= */

        .card {

            background: white;

            padding: 35px;

            border-radius: 22px;

            border:
                1px solid #e5e7eb;

            box-shadow:
                0 20px 50px
                rgba(15,23,42,.10);
        }


        .header {

            margin-bottom: 28px;
        }


        .header h1 {

            font-size: 29px;

            margin-bottom: 8px;
        }


        .header p {

            color: #64748b;

            font-size: 14px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;

            color: #334155;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #dbe2ea;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            background: #fff;

            transition: .2s;
        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px
                rgba(79,70,229,.10);
        }


        .form-group textarea {

            min-height: 110px;

            resize: vertical;
        }


        .errorlist {

            list-style: none;

            color: #dc2626;

            font-size: 12px;

            margin-top: 6px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 28px;
        }


        .btn {

            flex: 1;

            min-height: 48px;

            border: none;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }


        .cancel {

            background: #eef2ff;

            color: #4f46e5;
        }


        .cancel:hover {

            background: #e0e7ff;
        }


        .update {

            color: white;

            background:
                linear-gradient(
                    90deg,
                    #4f46e5,
                    #7c3aed
                );

            box-shadow:
                0 8px 20px
                rgba(79,70,229,.20);
        }


        .update:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(79,70,229,.30);
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:700px) {

            .navbar {

                padding: 15px 4%;

                flex-direction: column;

                gap: 12px;
            }


            .nav-links {

                justify-content: center;
            }


            .card {

                padding: 25px 20px;
            }

        }


        @media(max-width:500px) {

            .buttons {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

{% include "expenses/_navbar.html" %}

<!-- legacy navbar markup below is intentionally removed -->

    <div class="nav-links">

        <a href="{% url 'dashboard' %}">

        <a href="{% url 'expenses' %}">

        <a href="{% url 'add_expense' %}" class="active">

        <a href="{% url 'logout_confirm' %}" class="logout-btn">

<!-- =========================
     MAIN
========================= -->

<div class="container">


    <div class="card">


        <div class="header">

            <h1>
                ✏️ Edit Expense
            </h1>

            <p>
                Update your expense details below.
            </p>

        </div>


        <!-- FORM -->

        <form
            method="POST"
        >

            {% csrf_token %}


            {{ form.non_field_errors }}


            <!-- FORM FIELDS -->

            {% for field in form %}

                <div class="form-group">

                    {{ field.label_tag }}

                    {{ field }}

                    {{ field.errors }}

                </div>

            {% endfor %}


            <!-- BUTTONS -->

            <div class="buttons">


                <a
                    href="{% url 'expenses' %}"
                    class="btn cancel"
                >

                    ← Cancel

                </a>


                <button
                    type="submit"
                    class="btn update"
                >

                    ✓ Update Expense

                </button>


            </div>


        </form>


    </div>


</div>


</body>

</html>
