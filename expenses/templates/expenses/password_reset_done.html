{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'expenses/app.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email | Expense Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: Arial, sans-serif; background: linear-gradient(135deg, #4b3be7, #7c2fe8); color: #172033; }
        .card { width: min(100%, 440px); padding: 36px; text-align: center; background: #fff; border-radius: 18px; box-shadow: 0 24px 70px rgba(24, 15, 90, .28); }
        .icon { font-size: 48px; margin-bottom: 12px; }
        h1 { margin: 0 0 12px; font-size: 27px; }
        p { color: #64748b; line-height: 1.6; }
        a { display: inline-flex; justify-content: center; width: 100%; margin-top: 18px; padding: 14px; border-radius: 9px; color: #fff; background: #5b45e6; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">📩</div>
        <h1>Check your email</h1>
        <p>If an account exists for that email, a password reset link has been sent.</p>
        <a href="{% url 'login' %}">Back to login</a>
    </main>
</body>
</html>
