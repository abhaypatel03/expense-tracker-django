{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'expenses/app.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Expense Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: Arial, sans-serif; background: linear-gradient(135deg, #4b3be7, #7c2fe8); color: #172033; }
        .card { width: min(100%, 440px); padding: 34px; background: #fff; border-radius: 18px; box-shadow: 0 24px 70px rgba(24, 15, 90, .28); }
        .icon { width: 58px; height: 58px; display: grid; place-items: center; margin-bottom: 18px; border-radius: 16px; background: #eeeaff; font-size: 28px; }
        h1 { margin: 0 0 10px; font-size: 28px; }
        p { color: #64748b; line-height: 1.6; }
        label { display: block; margin: 24px 0 8px; font-weight: bold; font-size: 14px; }
        input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #d7dce8; border-radius: 9px; font-size: 15px; }
        input:focus { outline: 3px solid #eeeaff; border-color: #5b45e6; }
        button, a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 9px; font-weight: bold; text-decoration: none; }
        button { width: 100%; margin-top: 18px; border: 0; color: #fff; background: #5b45e6; cursor: pointer; }
        button:hover { background: #4734c9; }
        .back { width: 100%; margin-top: 12px; color: #5b45e6; background: #f1efff; }
        .errors { margin-top: 8px; color: #c2413d; font-size: 13px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">🔐</div>
        <h1>Forgot password?</h1>
        <p>Enter your registered email address and we will send you a password reset link.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.email.errors }}
            <label for="id_email">Email address</label>
            {{ form.email }}
            <button type="submit">Send reset link</button>
        </form>
        <a class="back" href="{% url 'login' %}">Back to login</a>
    </main>
</body>
</html>
