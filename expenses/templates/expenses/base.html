{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{% static 'expenses/app.css' %}">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Expense Tracker
        {% endblock %}
    </title>

    <style>
        :root {
            --bg: #f3f6ff;
            --bg-strong: #edf2ff;
            --card: #ffffff;
            --primary: #4f46e5;
            --primary-2: #7c3aed;
            --text: #111827;
            --muted: #64748b;
            --border: rgba(148, 163, 184, 0.22);
            --danger: #ef4444;
            --danger-strong: #dc2626;
            --shadow: 0 18px 40px rgba(79, 70, 229, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(79, 70, 229, 0.10), transparent 28%),
                radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.10), transparent 27%),
                linear-gradient(180deg, var(--bg-strong) 0%, #f8fafc 100%);
            color: var(--text);
        }

        a {
            text-decoration: none;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 74px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            color: white;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.18);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: white;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 13px;
            border-radius: 10px;
            transition: 0.25s ease;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .nav-links .active {
            background: rgba(255, 255, 255, 0.18);
        }

        .logout-btn {
            background: linear-gradient(135deg, var(--danger), var(--danger-strong));
            color: white !important;
            padding: 10px 16px;
            border-radius: 10px;
            box-shadow: 0 8px 18px rgba(239, 68, 68, 0.25);
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, var(--danger-strong), var(--danger));
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        /* ================= BUTTON ================= */

        .btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #4338ca;
        }

        /* ================= FOOTER ================= */

        .footer {
            margin-top: 60px;
            padding: 25px;
            text-align: center;
            background: white;
            color: #777;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .container {
                width: 94%;
            }

        }

    </style>

</head>


<body>

    {% include "expenses/_navbar.html" %}

    <main class="container">

        {% if messages %}
            {% for message in messages %}
                <div style="padding:12px 16px;margin-bottom:20px;background:#dcfce7;color:#166534;border-radius:8px;">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}

        {% endblock %}

    </main>

    <footer class="footer">

        <p>
            © 2026 Expense Tracker. All Rights Reserved.
        </p>

    </footer>


</body>

</html>
